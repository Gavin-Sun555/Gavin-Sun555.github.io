  [services.disqus]
    shortname = "https-gavin-sun555-github-io"
  [services.googleAnalytics]
    id = ""

[pagination]
  pagerSize = 5 # frontpage pagination

[outputs]
home = ["HTML", "RSS", "Algolia"]

[params]
  header_image = "img/home-bg.jpg"
  SEOTitle = "Yan Blog"
  description = "Software Developer, and World Traveler"
  keyword = ""
  slogan = ""
  upstreamAttribution = true

