  algolia_appId = "8FTF2IUFX8"
  algolia_indexName = "algolia"
  algolia_apiKey = "ea697c1c06eb948986928c3741fafe8b"

  # Sidebar settings
  sidebar_about_description = "Software Developer"
  #sidebar_avatar = ""      # use absolute URL, seeing it's used in both `/` and `/about/`
  sidebar_avatar = ""      # use absolute URL, seeing it's used in both `/` and `/about/`

  featured_tags = true 
  featured_condition_size = 1 


  disqus_site = ""




